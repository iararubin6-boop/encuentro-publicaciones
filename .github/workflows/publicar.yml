name: Publicar carruseles programados

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (prepara todo pero no publica)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicador
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client google-auth pillow
      - run: python publicar_programados.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '0' }}
